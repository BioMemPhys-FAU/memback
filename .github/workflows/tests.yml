name: Tests

"on":
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install MemBack with test dependencies
        run: pip install -e ".[test]"

      - name: Verify test dependencies are present
        run: |
          python -c "import pytest, pytest_cov; print('pytest', pytest.__version__)"
          pytest --version

      - name: Run unit tests
        run: >-
          pytest tests/unit -v
          --cov --cov-branch
          --cov-report=xml:coverage-unit.xml
        env:
          COVERAGE_FILE: .coverage.unit

      - name: Run integration tests
        run: >-
          pytest tests/integration -v -m integration
          --cov --cov-branch
          --cov-report=xml:coverage-integration.xml
        env:
          COVERAGE_FILE: .coverage.integration

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-unit.xml
          flags: unit,py${{ matrix.python-version }}
          fail_ci_if_error: true

      - name: Upload integration coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.xml
          flags: integration,py${{ matrix.python-version }}
          fail_ci_if_error: true

  map-integrity:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install MemBack without the model dependencies
        run: |
          pip install --no-deps -e .
          pip install numpy

      - name: Check map integrity
        run: |
          set -o pipefail
          {
            echo '## Map integrity'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          memback check_maps | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

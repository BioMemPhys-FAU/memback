[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memback"
version = "0.1.1"
description = "Neural backmapping of coarse-grained Martini 3 membranes to all-atom CHARMM36 structures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torch-geometric",
    "MDAnalysis",
    "numpy",
    "lmdb",
    "tqdm",
]

[project.scripts]
memback = "memback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# data/ and model/ hold no Python and are not packages, so they ride along as
# package data on memback itself.
[tool.setuptools.package-data]
memback = [
    "data/**/*",
    "model/*.pt",
]

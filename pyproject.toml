[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memback"
version = "0.1.1"
description = "Neural backmapping of coarse-grained Martini 3 membranes to all-atom CHARMM36 structures"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch",
    "torch-geometric",
    "MDAnalysis",
    "numpy",
    "lmdb",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.scripts]
memback = "memback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memback = [
    "data/**/*",
    "model/*.pt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: full-pipeline tests that need real .gro fixtures and/or the model checkpoint",
]
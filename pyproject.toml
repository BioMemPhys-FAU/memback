[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "memback"
dynamic = ["version"]
description = "Neural backmapping of coarse-grained Martini 3 membranes to all-atom CHARMM36 structures"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch",
    "torch-geometric",
    "MDAnalysis",
    "numpy",
    "lmdb",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.scripts]
memback = "memback.cli:main"

[tool.setuptools_scm]
# Used when building without git history, e.g. from a downloaded source zip.
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memback = [
    "data/**/*",
    "model/*.pt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: full-pipeline tests that need real .gro fixtures and/or the model checkpoint",
]
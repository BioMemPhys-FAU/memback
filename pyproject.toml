[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memback"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torch-geometric",
    "MDAnalysis",
    "numpy",
    "lmdb",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
